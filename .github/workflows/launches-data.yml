name: worthlookingup launch schedule

# Refreshes the published launch schedule: data/launches/upcoming.json.
#
# This is the server-side ingestion for the ROCKET LAUNCHES category and the primary freshness
# mechanism, because it runs on its own address: Launch Library 2 rate-limits per address and a 429 was
# observed from Cloudflare's shared egress addresses in production on 2026-10-15. It runs hourly, writes
# the artifact atomically only after it validates, and leaves the previous file untouched on any failure,
# so the site keeps serving the last good schedule. The launch provider is never contacted by a
# visitor's browser; the Pages endpoint serves this artifact and its edge cache, and refreshes upstream
# itself only when its copy is stale (older than 180 minutes).
#
# One run makes at most 4 upstream requests (up to 3 launch pages of 100 records plus one tiny
# announced-total request) against a 15-requests-per-hour allowance, and only when the artifact changed
# does it also rebuild and deploy.

on:
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:
    inputs:
      force_publish:
        description: Publish even when the schedule is unchanged (used for manual verification)
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: worthlookingup-launches
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Record the artifact as it is committed
        run: |
          if [ -f data/launches/upcoming.json ]; then
            sha256sum data/launches/upcoming.json | tee /tmp/before.sha256
          else
            echo 'no committed launch artifact yet' | tee /tmp/before.sha256
          fi

      - name: Refresh the launch schedule
        id: launches
        env:
          # A manual run is a verification run: it always writes so publication and the deployed
          # feed can be checked. A scheduled run defers when the schedule is unchanged and the
          # published copy is still comfortably fresh, which avoids a commit and a deployment for
          # a schedule that did not move.
          LAUNCH_FORCE_PUBLISH: ${{ inputs.force_publish && '1' || '' }}
        run: node scripts/refresh-launches.mjs

      - name: Validate the refreshed artifact offline
        run: node scripts/refresh-launches.mjs --check

      - name: Report the outcome
        run: |
          if [ -f data/launches/upcoming.json ] && ! git diff --quiet -- data/launches/upcoming.json; then
            echo 'artifact_changed=1' >> "$GITHUB_ENV"
          else
            echo 'artifact_changed=0' >> "$GITHUB_ENV"
          fi
          {
            echo '### Launch schedule refresh'
            echo
            echo "- event: ${{ github.event_name }}"
            echo "- refresh step: ${{ steps.launches.outcome }}"
            echo "- artifact rewritten this run: ${artifact_changed:-0}"
            if [ -f data/launches/upcoming.json ]; then
              node -e "const f=require('./data/launches/upcoming.json');console.log('- launches: '+f.launches.length);console.log('- generated: '+f.generated_at);console.log('- age at this run: '+Math.round((Date.now()-Date.parse(f.generated_at))/60000)+' minutes');console.log('- with a published time: '+f.stats.with_published_time);console.log('- with a published date: '+f.stats.with_published_date);console.log('- period only: '+f.stats.period_only);console.log('- announced overall: '+f.stats.announced_total);console.log('- provider: '+f.source.name+' '+f.source.api_version+' ('+f.source.pages+' request(s))');console.log('- upstream sha256: '+String(f.source.sha256).slice(0,16)+'...')" >> "$GITHUB_STEP_SUMMARY"
            else
              echo '- artifact missing' >> "$GITHUB_STEP_SUMMARY"
            fi
            if [ "${artifact_changed:-0}" = "0" ]; then
              echo '- publication: not needed; the schedule is unchanged and the published copy is still fresh, so no commit and no deployment were created.' >> "$GITHUB_STEP_SUMMARY"
            else
              echo '- publication: the schedule changed, so it is committed and deployed below.' >> "$GITHUB_STEP_SUMMARY"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.launches.outcome }}" = "failure" ]; then
            echo "The launch refresh failed. The committed artifact was left untouched, so the site keeps serving the last good schedule."
            exit 1
          fi

      - name: Commit the refreshed schedule
        id: commit
        run: |
          if git diff --quiet -- data/launches/upcoming.json; then
            echo 'changed=0' >> "$GITHUB_ENV"
            echo 'No schedule change to publish.'
            exit 0
          fi
          git config user.name 'worthlookingup-data-bot'
          git config user.email 'worthlookingup-data-bot@users.noreply.github.com'
          git add data/launches/upcoming.json
          git commit -m "Refresh Worth Looking Up launch schedule ($(date -u +%Y-%m-%dT%H:%MZ))" \
            -m "Generated by .github/workflows/launches-data.yml from Launch Library 2. The provider, retrieval timestamp, upstream payload digest, scheduling precision breakdown and any detected schedule changes are recorded inside the artifact."
          # main is shared with the celestial data bot, so a push can race another commit. Nothing is
          # ever forced: fetch, replay this single artifact commit on top, and retry a few times.
          pushed=0
          for attempt in 1 2 3; do
            if git push; then
              pushed=1
              break
            fi
            echo "push attempt $attempt was rejected; fetching origin/main and replaying this commit"
            git fetch --quiet origin main || { echo 'could not fetch origin/main'; exit 1; }
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo 'This commit could not be replayed on top of origin/main without a conflict. Nothing was pushed and no history was rewritten.'
              exit 1
            fi
          done
          if [ "$pushed" != "1" ]; then
            echo 'The refreshed schedule could not be pushed after three attempts. Nothing was forced and no history was rewritten.'
            exit 1
          fi
          echo 'changed=1' >> "$GITHUB_ENV"

      # GITHUB_TOKEN bot pushes do not trigger the separate push workflow.
      #
      # Publication validates this pipeline only: the artifact itself, the launch schedule engine and
      # the launch presentation and endpoint rules. The complete browser and scientific regression
      # suites belong to the separate validation workflow and must never gate an hourly data
      # publication, because a defect in an unrelated vertical would then leave the site serving an
      # aging schedule.
      - name: Publish the refreshed schedule to Pages
        if: env.changed == '1' && vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'
        run: |
          npm ci
          node scripts/refresh-launches.mjs --check
          node tests/launches-feed.cjs
          node tests/launches-relevance.cjs
          node tests/launches-worker.cjs
          npm run build
          npx wrangler pages deploy dist --project-name worthlookingup --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b1aa310aa0a1638d72b8b086a21e557c

      - name: Verify the deployed launch feed
        if: env.changed == '1' && vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'
        run: |
          for attempt in $(seq 1 12); do
            if node -e "
              const check=async()=>{
                const response=await fetch('https://worthlookingup.com/api/launches.json',{signal:AbortSignal.timeout(20000)});
                if(response.status!==200)throw new Error('HTTP '+response.status);
                const feed=await response.json();
                if(feed.schema!=='worthlookingup.launches/1')throw new Error('unexpected schema '+feed.schema);
                if(!feed.available||!feed.launches.length)throw new Error('the deployed feed has no launch');
                if(!feed.source||!feed.source.name)throw new Error('the deployed feed has no source');
                if(!Number.isFinite(Date.parse(feed.generated_at)))throw new Error('the deployed feed has no freshness timestamp');
                const ageMinutes=(Date.now()-Date.parse(feed.generated_at))/60000;
                const horizon=Number.isFinite(feed.stale_after_minutes)?feed.stale_after_minutes:180;
                // A served copy may still be an edge cache of the previous publication, which the
                // freshness deadline keeps well inside the staleness horizon. Anything older than the
                // horizon is a real freshness failure: it is retried and then reported, so a
                // publication that did not actually reach readers cannot pass silently.
                if(ageMinutes>horizon)throw new Error('the served schedule is '+Math.round(ageMinutes)+' minutes old, past the '+horizon+'-minute staleness horizon');
                console.log('deployed launch feed: '+feed.launches.length+' launches, served_by '+feed.served_by+', generated '+feed.generated_at+' ('+Math.round(ageMinutes)+' minutes old), stale '+feed.stale+', source '+feed.source.name);
              };
              check().catch(error=>{console.error(String(error.message||error));process.exit(1);});
            "; then
              exit 0
            fi
            echo "attempt $attempt: the deployed launch feed is not ready yet"
            sleep 10
          done
          echo 'The deployed launch feed did not become available with a valid source and a freshness timestamp inside the staleness horizon.'
          exit 1
