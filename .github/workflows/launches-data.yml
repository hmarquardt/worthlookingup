name: worthlookingup launch schedule

# Refreshes the published launch schedule: data/launches/upcoming.json.
#
# This is the server-side ingestion for the ROCKET LAUNCHES category. It runs hourly, writes the
# artifact atomically only after it validates, and leaves the previous file untouched on any failure, so
# the site keeps serving the last good schedule. The launch provider (Launch Library 2) is never
# contacted by a visitor's browser; the Pages endpoint serves this artifact and its own edge cache.
#
# One run makes at most 3 upstream requests (2 launch pages plus one tiny announced-total request)
# against a 15-requests-per-hour allowance.

on:
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: worthlookingup-launches
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Record the artifact as it is committed
        run: |
          if [ -f data/launches/upcoming.json ]; then
            sha256sum data/launches/upcoming.json | tee /tmp/before.sha256
          else
            echo 'no committed launch artifact yet' | tee /tmp/before.sha256
          fi

      - name: Refresh the launch schedule
        id: launches
        run: node scripts/refresh-launches.mjs

      - name: Validate the refreshed artifact offline
        run: node scripts/refresh-launches.mjs --check

      - name: Report the outcome
        run: |
          {
            echo '### Launch schedule refresh'
            echo
            echo "- refresh step: ${{ steps.launches.outcome }}"
            if [ -f data/launches/upcoming.json ]; then
              node -e "const f=require('./data/launches/upcoming.json');console.log('- launches: '+f.launches.length);console.log('- generated: '+f.generated_at);console.log('- with a published time: '+f.stats.with_published_time);console.log('- with a published date: '+f.stats.with_published_date);console.log('- period only: '+f.stats.period_only);console.log('- announced overall: '+f.stats.announced_total);console.log('- provider: '+f.source.name+' '+f.source.api_version+' ('+f.source.pages+' request(s))');console.log('- upstream sha256: '+String(f.source.sha256).slice(0,16)+'...')" >> "$GITHUB_STEP_SUMMARY"
            else
              echo '- artifact missing' >> "$GITHUB_STEP_SUMMARY"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.launches.outcome }}" = "failure" ]; then
            echo "The launch refresh failed. The committed artifact was left untouched, so the site keeps serving the last good schedule."
            exit 1
          fi

      - name: Commit the refreshed schedule
        id: commit
        run: |
          if git diff --quiet -- data/launches/upcoming.json; then
            echo 'changed=0' >> "$GITHUB_ENV"
            echo 'No schedule change to publish.'
            exit 0
          fi
          git config user.name 'worthlookingup-data-bot'
          git config user.email 'worthlookingup-data-bot@users.noreply.github.com'
          git add data/launches/upcoming.json
          git commit -m "Refresh Worth Looking Up launch schedule ($(date -u +%Y-%m-%dT%H:%MZ))" \
            -m "Generated by .github/workflows/launches-data.yml from Launch Library 2. The provider, retrieval timestamp, upstream payload digest, scheduling precision breakdown and any detected schedule changes are recorded inside the artifact."
          git push
          echo 'changed=1' >> "$GITHUB_ENV"

      # GITHUB_TOKEN bot pushes do not trigger the separate push workflow.
      - name: Publish the refreshed schedule to Pages
        if: env.changed == '1' && vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'
        run: |
          npm ci
          npm test
          npm run build
          npx wrangler pages deploy dist --project-name worthlookingup --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b1aa310aa0a1638d72b8b086a21e557c

      - name: Verify the deployed launch feed
        if: env.changed == '1' && vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'
        run: |
          for attempt in $(seq 1 12); do
            if node -e "
              const check=async()=>{
                const response=await fetch('https://worthlookingup.com/api/launches.json',{signal:AbortSignal.timeout(20000)});
                if(response.status!==200)throw new Error('HTTP '+response.status);
                const feed=await response.json();
                if(feed.schema!=='worthlookingup.launches/1')throw new Error('unexpected schema '+feed.schema);
                if(!feed.available||!feed.launches.length)throw new Error('the deployed feed has no launch');
                if(!feed.source||!feed.source.name)throw new Error('the deployed feed has no source');
                if(!Number.isFinite(Date.parse(feed.generated_at)))throw new Error('the deployed feed has no freshness timestamp');
                console.log('deployed launch feed: '+feed.launches.length+' launches, served_by '+feed.served_by+', generated '+feed.generated_at+', source '+feed.source.name);
              };
              check().catch(error=>{console.error(String(error.message||error));process.exit(1);});
            "; then
              exit 0
            fi
            echo "attempt $attempt: the deployed launch feed is not ready yet"
            sleep 10
          done
          echo 'The deployed launch feed did not become available with a valid source and freshness timestamp.'
          exit 1
